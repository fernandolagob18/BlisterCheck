name: Daily Shortage Check

on:
  schedule:
    # Se ejecuta a las 8:00 AM hora Madrid ( CET = UTC+1 )
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite ejecución manual para pruebas

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install script dependencies
        run: |
          cd scripts
          npm init -y
          npm install @supabase/supabase-js

      - name: Run shortage check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: node scripts/check-shortages.js
